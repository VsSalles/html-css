<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pensar em HTML e CSS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        #heading {
            display: flex;
            justify-content: space-between;
            background-color: red;
        }
        h1 {
            font-size: 20px;
            text-transform: uppercase;
        }
        a {
            color: white;
            text-decoration: None;
            font-family: sans-serif;
        }
        header {
            margin: 20px;
        }

    </style>
</head>
<body>
    <header id="heading">
        <h2><a href="#">Netflix</a></h2>
        <h2><a href="#">Entrar</a></h2>
    </header>

</body>
</html>
